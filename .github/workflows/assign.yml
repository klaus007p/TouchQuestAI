name: Assign command

on:
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  assign:
    if: ${{ !github.event.issue.pull_request && startsWith(github.event.comment.body, '/assign') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const user = context.payload.comment.user.login;
            const base = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
            };

            if (issue.assignees.length > 0) {
              const who = issue.assignees.map(a => "@" + a.login).join(", ");
              await github.rest.issues.createComment({
                ...base,
                body: `Sorry @${user}, this issue is already assigned to ${who}. Have a look at other \`good first issue\` items! 🌱`,
              });
              return;
            }

            await github.rest.issues.addAssignees({ ...base, assignees: [user] });
            await github.rest.issues.createComment({
              ...base,
              body: `Assigned to @${user}. Thanks! Please open a PR within about a week, or comment here if you need more time.`,
            });
