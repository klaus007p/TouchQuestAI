name: Stale PRs

on:
  schedule:
    - cron: "0 3 * * *"

permissions:
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-issue-stale: -1
          days-before-issue-close: -1
          days-before-pr-stale: 7
          days-before-pr-close: 7
          stale-pr-label: stale
          exempt-pr-labels: hacktoberfest-accepted
          stale-pr-message: "This PR has had no activity for 7 days. Are you still working on it? It will be closed in 7 days if there's no update."
          close-pr-message: "Closing due to inactivity. Feel free to reopen it when you're ready!"
